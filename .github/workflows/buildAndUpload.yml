name: Build and Upload

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  # Reused by release.yml to build the release artifacts
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [20.x]
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download mpv
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          # Authenticated API calls avoid the shared runner IP's anonymous rate limit.
          # github.token also works when this workflow is called from release.yml.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest stable mpv release (not nightly)
          $release = $null
          for ($i = 1; $i -le 3 -and -not $release; $i++) {
              try {
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/mpv-player/mpv/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "open-tv-ci" }
              } catch { Write-Host "GitHub API error: $_. Retrying..."; Start-Sleep -Seconds 10 }
          }
          if (-not $release) { throw "Could not query the latest mpv release" }
          $latestUrl = ($release.assets | Where-Object { $_.name -match "^mpv-v[\d.]+-x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1).browser_download_url
          if (-not $latestUrl) { throw "No x86_64 MSVC zip in mpv release $($release.tag_name)" }
          Write-Host "Using mpv $($release.tag_name): $latestUrl"

          $retryCount = 3
          $retryDelay = 5

          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri $latestUrl -OutFile .\mpv.zip
                  break
              }
              catch {
                  Start-Sleep -Seconds $retryDelay
              }
          }

          New-Item -Path 'C:\open-tv-deps' -ItemType Directory -Force
          7z e .\mpv.zip -oC:\open-tv-deps mpv.exe vulkan-1.dll -y

      - name: Download ffmpeg
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest stable release branch build (e.g. n9.0), not master
          $release = $null
          for ($i = 1; $i -le 3 -and -not $release; $i++) {
              try {
                  $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "open-tv-ci" }
              } catch { Write-Host "GitHub API error: $_. Retrying..."; Start-Sleep -Seconds 10 }
          }
          if (-not $release) { throw "Could not query the latest BtbN FFmpeg release" }
          $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-\1\.\2\.zip$' } | Sort-Object { [version]($_.name -replace '^ffmpeg-n([\d.]+)-.*','$1') } -Descending | Select-Object -First 1
          if (-not $asset) { throw "No stable win64-gpl ffmpeg build found in BtbN release" }
          $ffmpegBase = $asset.name -replace '\.zip$',''
          Write-Host "Using ffmpeg $($asset.name)"

          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri $asset.browser_download_url -OutFile .\ffmpeg.zip
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          7z e .\ffmpeg.zip -oC:\open-tv-deps "$ffmpegBase/bin/ffmpeg.exe"

      - name: Download yt-dlp
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp.exe
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          Move-Item -Path yt-dlp.exe -Destination C:\open-tv-deps

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - name: Install deps project
        run: |
          npm install

      - name: Build
        if: startsWith(matrix.os, 'macos-')
        run: |
          CI=true npm run tauri build

      - name: Build
        if: matrix.os == 'windows-latest'
        run: |
          npm run tauri build

      - name: Build
        if: matrix.os == 'ubuntu-22.04'
        run: |
          npm run tauri build -- --bundles deb,rpm
          
      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: open-tv-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 60

      - name: Upload DEB
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: open-tv-debian
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 60

      - name: Upload RPM
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: open-tv-redhat
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 60

      - name: Upload DMG ARM64
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: open-tv-mac-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60

      - name: Upload DMG AMD64
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v4
        with:
          name: open-tv-mac-AMD64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 60
